    <g transform="translate(22 17)">
      <ellipse cx="0" cy="-6" rx="2.4" ry="4.4"/>
      <ellipse cx="0" cy="-6" rx="2.4" ry="4.4" transform="rotate(72)"/>
      <ellipse cx="0" cy="-6" rx="2.4" ry="4.4" transform="rotate(144)"/>
      <ellipse cx="0" cy="-6" rx="2.4" ry="4.4" transform="rotate(216)"/>
      <ellipse cx="0" cy="-6" rx="2.4" ry="4.4" transform="rotate(288)"/>
