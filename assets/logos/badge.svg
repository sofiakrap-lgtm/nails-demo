<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Nails Lindes badge">
  <defs>
    <path id="nl-arc-top" d="M40 100 a60 60 0 0 1 120 0"/>
    <path id="nl-arc-bot" d="M44 100 a56 56 0 0 0 112 0"/>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#645A4E" stroke-width="1.2"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#CFC9B3" stroke-width="1"/>

  <!-- Curved wordmark -->
  <g fill="#645A4E" font-family="'Cormorant Garamond', serif" font-size="15" letter-spacing="5" font-weight="500">
    <text>
      <textPath href="#nl-arc-top" startOffset="50%" text-anchor="middle">NAILS LINDES</textPath>
    </text>
  </g>
  <g fill="#645A4E" font-family="'Cormorant Garamond', serif" font-size="11" letter-spacing="4" font-style="italic">
    <text>
      <textPath href="#nl-arc-bot" startOffset="50%" text-anchor="middle">since 2026</textPath>
    </text>
  </g>

  <!-- Floral arch centre -->
  <g transform="translate(100 100)">
    <path d="M-22 34 V6 a22 22 0 0 1 44 0 V34" fill="none" stroke="#645A4E" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M0 26 V2" fill="none" stroke="#645A4E" stroke-width="1.4"/>
    <path d="M0 18 q-8 -2 -11 -9 q8 0 11 5" fill="#645A4E"/>
    <path d="M0 14 q8 -2 11 -9 q-8 0 -11 5" fill="#645A4E"/>
    <g fill="#645A4E" transform="translate(0 -4)">
      <ellipse cx="0" cy="-7" rx="2.8" ry="5.2"/>
      <ellipse cx="0" cy="-7" rx="2.8" ry="5.2" transform="rotate(72)"/>
      <ellipse cx="0" cy="-7" rx="2.8" ry="5.2" transform="rotate(144)"/>
      <ellipse cx="0" cy="-7" rx="2.8" ry="5.2" transform="rotate(216)"/>
      <ellipse cx="0" cy="-7" rx="2.8" ry="5.2" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="-8" r="3" fill="#D8C094"/>
  </g>

  <!-- Side sparks -->
  <path d="M30 100 l3 4 4 -3 -4 -3z" fill="#94A3AF"/>
  <path d="M170 100 l-3 4 -4 -3 4 -3z" fill="#94A3AF"/>
</svg>
